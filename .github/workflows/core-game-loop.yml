name: Horse Ranch core checks
on:
  push:
    branches:
      - work/hr-core-game-loop
  pull_request:
    paths:
      - index.html
      - systems/**
      - tests/**
      - .github/workflows/core-game-loop.yml
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Core and existing rules regression tests
        shell: bash
        run: |
          set -euo pipefail
          for file in tests/*.test.cjs; do
            echo "Running $file"
            node "$file"
          done
