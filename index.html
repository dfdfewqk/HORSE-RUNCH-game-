function horseCard(h){return `<div class="card horseCard"><div class="between"><div class="name">${escapeHtml(h.name)}</div><span class="badge">${genderLabel(h)}</span></div><div class="horseImgWrap"><img class="horseImg" src="${imgFor(h)}"></div><div class="mini">${age(h)}세 · ${h.color} · ${h.distanceBand} · ${h.style}</div><div class="stat"><span>능력</span><b>${h.speed}/${h.stamina}/${h.power}</b></div><div class="stat"><span>전적</span><b>${h.starts}전 ${h.wins}승</b></div><div class="row" style="margin-top:7px"><button class="action gray" onclick="openDetail(${h.id})">상세정보</button><button class="action" onclick="quickRace(${h.id})">다음 경주</button></div></div>`}
function dashboard(){const todayR=state.races.filter(r=>r.year===state.year&&r.month===state.month&&r.day===state.day);const pending=state.registrations.map(x=>({x,r:state.races.find(r=>r.id===x.raceId)})).filter(z=>z.r);const preg=state.breedings.slice().sort((a,b)=>a.due-b.due)[0];return `<div class="hero"><div class="heroText"><h2>${escapeHtml(state.ranchName)} 목장</h2><p>목장 운영, 경주, 번식, 시장을 하나의 흐름으로 관리합니다.</p><div class="row" style="margin-top:8px"><span class="badge">${state.year}년 ${state.month}월 ${state.day}일</span><span class="badge">보유마 ${state.horses.length}/${state.stalls}</span><span class="badge">명성 ${state.reputation}</span></div></div></div><div class="kpi" style="margin:12px 0"><div class="card"><div class="small">자금</div><h2>${money(state.money)}</h2></div><div class="card"><div class="small">보유마</div><h2>${state.horses.length}</h2></div><div class="card"><div class="small">통산 승</div><h2>${state.results.filter(x=>x.place===1).length}</h2></div><div class="card"><div class="small">오늘 등록</div><h2>${pending.length}</h2></div><div class="card"><div class="small">임신</div><h2>${state.breedings.length}</h2></div><div class="card"><div class="small">혈통권</div><h2>${state.breedingCredits}</h2></div></div><div class="grid"><div class="panel"><div class="panelTitle"><h2>오늘 해야 할 일</h2><span class="badge">${pending.length+state.breedings.length}건</span></div>${pending.map(z=>`<div class="notice good">${z.r.month}/${z.r.day} ${z.r.no}R · ${escapeHtml(horse(z.x.horseId)?.name||'-')} · ${escapeHtml(getJockey(z.x.jockeyId)?.name||'-')} · <button class="action gray" onclick="openRace('${z.r.id}')">확인</button></div>`).join('')||'<div class="notice good">급한 출전 일정이 없습니다.</div>'}${preg?`<div class="notice warn">다음 출산 · ${escapeHtml(preg.mareName)} × ${escapeHtml(preg.sireName)} · ${Math.max(0,preg.due-today())}일 남음</div>`:''}<div class="row" style="margin-top:8px"><button class="action" onclick="advanceDay()">하루 진행</button><button class="action gray" onclick="advanceWeek()">7일 진행</button></div></div><div class="panel"><div class="panelTitle"><h2>오늘 경주</h2><span class="badge">경주 일정</span></div>${todayR.slice(0,8).map(r=>{const mine=state.results.filter(x=>x.raceId===r.id).slice(-1)[0];const finished=r.state==='finished';return `<div class="card" style="margin-bottom:7px"><div class="between"><b>${r.no}R · ${r.grade}</b><span class="badge">${r.dist}m · ${band(r.dist)}</span></div><div class="small">${r.surface} · ${r.weather}</div>${finished&&mine?`<div class="notice good" style="margin-top:7px">${escapeHtml(mine.horse)} · <b>${mine.place}착</b></div><button type="button" class="action gold" style="margin-top:7px;width:100%" onclick="openRaceResult('${r.id}')">경기 결과 보기</button>`:finished?`<div class="notice" style="margin-top:7px">경기 종료 · 우리 말 출전 결과 없음</div>`:`<button type="button" class="action" style="margin-top:7px;width:100%" onclick="prepareRace('${r.id}')">출전 준비</button>`}</div>`}).join('')||'<div class="muted">오늘 경주가 없습니다.</div>'}</div></div>`}
function stable(){const fs=['전체','현역','휴식','부상','번식','은퇴'];const status=h=>h.retired?'은퇴':h.pregnantUntil?'번식':h.injury? '부상':h.fatigue>=65?'휴식':'현역';let rows=state.horses.filter(h=>state.stableFilter==='전체'||status(h)===state.stableFilter);return `<div class="panel"><div class="panelTitle"><div><h2>마방</h2><div class="small">말을 열어 상세정보를 보고 다음 경주로 바로 이동합니다.</div></div><span class="badge">${rows.length}마</span></div><div class="subnav">${fs.map(f=>`<button class="${state.stableFilter===f?'active':''}" onclick="state.stableFilter='${f}';render()">${f}</button>`).join('')}</div><div class="grid">${rows.map(horseCard).join('')||'<div class="muted">조건에 맞는 말이 없습니다.</div>'}</div></div>`}
function training(){const hs=state.horses.filter(h=>!h.retired&&age(h)>=2);return `<div class="panel"><div class="panelTitle"><div><h2>말 교육</h2><div class="small">말마다 월 4회 · 훈련 능력은 자마 유전에 직접 더해지지 않습니다.</div></div></div><div class="grid">${hs.map(h=>{const used=Number(state.training.used[h.id]||0);return `<div class="card"><div class="between"><div><h3 style="margin:0">${escapeHtml(h.name)}</h3><div class="small">${genderLabel(h)} · ${age(h)}세</div></div><span class="badge">${used}/4회</span></div><div class="stat"><span>현재</span><b>${h.speed}/${h.stamina}/${h.power}</b></div><div class="stat"><span>한계</span><b>${h.caps.speed}/${h.caps.stamina}/${h.caps.power}</b></div><div class="stat"><span>남은 성장</span><b>${h.caps.speed-h.speed}/${h.caps.stamina-h.stamina}/${h.caps.power-h.power}</b></div><div class="stat"><span>컨디션 / 피로</span><b>${h.condition} / ${h.fatigue}</b></div><div class="row" style="margin-top:7px"><button class="action" ${used>=4||h.speed>=h.caps.speed?'disabled':''} onclick="train(${h.id},'speed')">속도</button><button class="action" ${used>=4||h.stamina>=h.caps.stamina?'disabled':''} onclick="train(${h.id},'stamina')">지구력</button><button class="action" ${used>=4||h.power>=h.caps.power?'disabled':''} onclick="train(${h.id},'power')">파워</button><button class="action gray" onclick="rest(${h.id})">휴식</button></div></div>`}).join('')||'<div class="muted">교육 가능한 말이 없습니다.</div>'}</div></div>`}
function train(id,type){const h=horse(id);if(!h)return;const mk=monthKey();if(state.training.monthKey!==mk){state.training.monthKey=mk;state.training.used={}}const used=Number(state.training.used[id]||0);if(used>=4)return alert('이번 달 교육 4회를 모두 사용했습니다.');if(h.fatigue>=72)return alert('피로가 높아 교육할 수 없습니다.');if(h[type]>=h.caps[type])return alert('성장 한계에 도달했습니다.');const gain=Math.min(rnd(1,2),h.caps[type]-h[type]);h[type]+=gain;state.training.used[id]=used+1;h.fatigue=clamp(h.fatigue+rnd(9,16),0,100);h.condition=clamp(h.condition-rnd(2,4),25,100);log(`${h.name} ${type==='speed'?'속도':type==='stamina'?'지구력':'파워'} 교육.`);save();render()}
function rest(id){const h=horse(id);if(!h)return;h.fatigue=clamp(h.fatigue-20,0,100);h.condition=clamp(h.condition+6,25,100);save();render()}
function eligible(h,r){if(!h||h.retired||h.injury||h.pregnantUntil||age(h)<2)return false;if(today()-h.lastRaceIndex<8)return false;if(r.grade==='신마')return h.starts===0;if(r.grade==='미승리')return h.wins===0;return true}
function recommend(h,r){let s=horseScore(h);const order=['단거리','마일','중거리','장거리','초장거리'];const gap=Math.abs(order.indexOf(h.distanceBand)-order.indexOf(band(r.dist)));if(gap===0)s+=8;else s-=Math.min(10,gap*4);if(h.surface===r.surface)s+=5;else s-=2;if(h.condition>=88)s+=2;if(h.fatigue<=25)s+=2;if(h.caps.speed-h.speed>5||h.caps.stamina-h.stamina>5)s+=1;return s}
function jockeyCompat(h,r,j){return (j.style.includes(h.style)?5:0)+(j.bands.includes(band(r.dist))?4:0)+(j.pace>=82?2:0)+(j.corner>=82?2:0)+(j.finish>=82?2:0)}
function bestJockey(h,r){return JOCKEYS.map(j=>({j,score:jockeyCompat(h,r,j)})).sort((a,b)=>b.score-a.score)[0]}
function raceList(){const upcomingAll=state.races.filter(r=>r.state!=='finished'&&dateIndex(r.year,r.month,r.day)>=today()).filter(r=>state.raceFilter==='전체'||band(r.dist)===state.raceFilter).sort((a,b)=>dateIndex(a.year,a.month,a.day)-dateIndex(b.year,b.month,b.day)||a.no-b.no);const upcoming=upcomingAll.slice(0,6);const pending=state.registrations.map(x=>({x,r:state.races.find(r=>r.id===x.raceId)})).filter(z=>z.r);const completed=state.races.filter(r=>r.state==='finished').filter(r=>state.raceFilter==='전체'||band(r.dist)===state.raceFilter).sort((a,b)=>dateIndex(b.year,b.month,b.day)-dateIndex(a.year,a.month,a.day)||b.no-a.no);const myCompleted=completed.filter(r=>state.results.some(x=>x.raceId===r.id)).slice(0,6);const sel=state.selectedRace?state.races.find(r=>r.id===state.selectedRace):null;const routineDays=[10,24];return `<div class="panel"><div class="panelTitle"><div><h2>경주</h2><div class="small">제1경마장 · 매월 10일 / 24일 · 하루 3R</div></div><span class="badge">월 6경주</span></div><div class="notice" style="margin-bottom:10px"><b>경주 루틴</b> · 10일 · 24일에만 경주가 열립니다. 24일 3R은 3·6·9·12월에 G1으로 진행됩니다.</div><div class="subnav">${['전체',...DIST_BANDS].map(f=>`<button class="${state.raceFilter===f?'active':''}" onclick="state.raceFilter='${f}';state.selectedRace=null;render()">${f}</button>`).join('')}</div></div><div class="grid"><div class="panel"><div class="panelTitle"><div><h3 style="margin:0">내가 등록한 경기</h3><div class="small">출전등록한 경기는 여기서 바로 확인합니다.</div></div><span class="badge">${pending.length}건</span></div>${pending.slice(0,6).map(z=>`<div class="card" style="margin-bottom:7px"><div class="between"><div><b>${z.r.month}/${z.r.day} ${z.r.no}R · ${z.r.grade}</b><div class="small">${z.r.dist}m · ${escapeHtml(horse(z.x.horseId)?.name||'-')} · ${escapeHtml(getJockey(z.x.jockeyId)?.name||'-')}</div></div><span class="badge">${dateIndex(z.r.year,z.r.month,z.r.day)===today()?'오늘':'대기'}</span></div></div>`).join('')||'<div class="muted">등록한 경기가 없습니다.</div>'}</div><div class="panel"><div class="panelTitle"><div><h3 style="margin:0">최근 경기 결과</h3><div class="small">경기가 끝나면 여기서 바로 결과를 확인합니다.</div></div><span class="badge">${myCompleted.length}건</span></div>${myCompleted.map(r=>{const mine=state.results.filter(x=>x.raceId===r.id).slice(-1)[0];return `<div class="card" style="margin-bottom:7px"><div class="between"><div><b>${r.month}/${r.day} ${r.no}R · ${r.grade}</b><div class="small">${escapeHtml(mine?.horse||'-')} · ${mine?mine.place+'착':'결과 저장됨'}</div></div><button class="action gray" onclick="openRaceResult('${r.id}')">경기 결과 보기</button></div></div>`}).join('')||'<div class="muted">아직 확인할 경기 결과가 없습니다.</div>'}</div></div><div class="panel"><div class="panelTitle"><div><h3 style="margin:0">예정된 경기</h3><div class="small">먼저 가까운 6개 경주만 표시합니다.</div></div><span class="badge">${upcomingAll.length}개 중 ${upcoming.length}개 표시</span></div><div class="grid">${upcoming.map(r=>{const reg=state.registrations.find(x=>x.raceId===r.id);return `<div class="card"><div class="between"><div><b>${r.month}/${r.day} ${r.no}R · ${r.grade}</b><div class="small">${r.surface} · ${r.weather}</div></div><span class="badge">${r.dist}m · ${band(r.dist)}</span></div>${reg?`<div class="notice good">출전등록 · ${escapeHtml(horse(reg.horseId)?.name||'-')} · ${escapeHtml(getJockey(reg.jockeyId)?.name||'-')}</div>`:''}<button type="button" class="action" style="margin-top:7px;width:100%" onclick="prepareRace('${r.id}')">${sel?.id===r.id?'닫기':'출전 준비'}</button></div>`}).join('')}</div></div>${sel?raceChooser(sel):'<div class="notice" style="margin-top:10px">경주를 선택하면 추천마와 기수를 고를 수 있습니다.</div>'}<div class="panel"><div class="panelTitle"><div><h3 style="margin:0">지난 경기 전체 기록</h3><div class="small">기록실에서도 다시 볼 수 있습니다.</div></div><span class="badge">${completed.length}건</span></div>${completed.slice(0,10).map(r=>{const mine=state.results.filter(x=>x.raceId===r.id).slice(-1)[0];return `<div class="row" style="justify-content:space-between;padding:7px 0;border-bottom:1px dashed #3a3e44"><span>${r.month}/${r.day} ${r.no}R · ${r.grade} · ${escapeHtml(mine?.horse||'보유마 결과 없음')} ${mine?mine.place+'착':''}</span><button class="action gray" onclick="openRaceResult('${r.id}')">보기</button></div>`}).join('')||'<div class="muted">아직 완료된 경기가 없습니다.</div>'}</div>`}
function prepareRace(id){const r=state.races.find(x=>x.id===id);if(!r)return;state.selectedRace=id;state.selectedHorse=null;state.selectedJockey=null;render();setTimeout(()=>document.getElementById('raceChooser')?.scrollIntoView({behavior:'smooth',block:'start'}),40)}
function openRace(id){prepareRace(id)}
function raceChooser(r){const list=state.horses.filter(h=>eligible(h,r)).sort((a,b)=>recommend(b,r)-recommend(a,r));if(!list.length)return `<div class="panel" id="raceChooser"><div class="notice warn">현재 출전 가능한 보유마가 없습니다. 거리 특화는 출전 제한이 아니라 추천도와 성적에 반영됩니다.</div></div>`;const current=horse(state.selectedHorse)&&list.some(h=>h.id===state.selectedHorse)?horse(state.selectedHorse):list[0];const bj=bestJockey(current,r);const chosenJ=getJockey(state.selectedJockey)||bj.j;return `<div class="panel" id="raceChooser"><div class="panelTitle"><div><h2>${r.month}/${r.day} ${r.no}R · 출전 결정</h2><div class="small">제1경마장 · ${r.grade} · ${r.dist}m · ${band(r.dist)} · ${r.surface} · ${r.weather}</div></div><span class="badge">추천 TOP 3</span></div><div class="grid">${list.slice(0,3).map((h,i)=>`<div class="card ${current.id===h.id?'selected':''}"><div class="between"><h3 style="margin:0">${escapeHtml(h.name)}</h3><span class="badge">${genderLabel(h)}</span></div><div class="horseImgWrap"><img class="horseImg" src="${imgFor(h)}"></div><div class="small">${age(h)}세 · ${h.distanceBand} · ${h.style}</div><div class="stat"><span>현재 능력</span><b>${h.speed}/${h.stamina}/${h.power}</b></div><div class="stat"><span>성장 한계</span><b>${h.caps.speed}/${h.caps.stamina}/${h.caps.power}</b></div><div class="stat"><span>추천도</span><b>${Math.round(recommend(h,r))}</b></div><button class="action ${current.id===h.id?'gold':''}" style="width:100%;margin-top:7px" onclick="state.selectedHorse=${h.id};state.selectedJockey=null;render()">${current.id===h.id?'✓ 선택됨':'이 말 선택'}</button></div>`).join('')}</div><div class="panel" style="margin-top:10px"><div class="panelTitle"><div><h3>${escapeHtml(current.name)} · 기수 선택</h3><div class="small">추천 기수를 기본 선택하지만 다른 기수도 직접 선택할 수 있습니다.</div></div><span class="badge">추천: ${escapeHtml(bj.j.name)}</span></div><div class="jockeyChoice">${JOCKEYS.map(j=>`<div class="card jockeyCard ${chosenJ.id===j.id?'selected':''}" onclick="state.selectedJockey='${j.id}';render()"><div class="between"><h3>${escapeHtml(j.name)}</h3><span class="badge">${j.gender}</span></div><div class="jockeyPortrait">${j.gender==='여'?'♀':'♂'}</div><div class="stat"><span>궁합</span><b>+${jockeyCompat(current,r,j)}</b></div><div class="stat"><span>능력</span><b>${j.skill}</b></div><div class="small">${j.style.join(', ')} · ${j.bands.join(', ')} · ${j.exp||0} EXP</div>${bj.j.id===j.id?'<div class="small goldText" style="margin-top:5px">★ 추천 기수</div>':''}</div>`).join('')}</div><div class="notice good" style="margin-top:9px"><b>선택 조합</b> · ${escapeHtml(current.name)} × ${escapeHtml(chosenJ.name)} · 궁합 +${jockeyCompat(current,r,chosenJ)}<button class="action green" style="margin-left:8px" onclick="todayOrRegister('${r.id}',${current.id},'${chosenJ.id}')">${r.year===state.year&&r.month===state.month&&r.day===state.day?'이 조합으로 출전':'이 조합으로 등록'}</button></div></div>${list.length>3?`<details><summary>출전 가능 말 전체 보기 (${list.length}마리)</summary><div class="small" style="margin-top:7px">${list.slice(3).map(h=>`${escapeHtml(h.name)} · ${genderLabel(h)} · 추천도 ${Math.round(recommend(h,r))}`).join(' / ')}</div></details>`:''}</div>`}
function todayOrRegister(rid,hid,jid){const r=state.races.find(x=>x.id===rid);state.selectedHorse=hid;state.selectedJockey=jid;if(r.year===state.year&&r.month===state.month&&r.day===state.day)runRace(rid,jid);else registerRace(rid,hid,jid)}
function registerRace(rid,hid,jid){const r=state.races.find(x=>x.id===rid),h=horse(hid),j=getJockey(jid);if(!r||!h||!j)return;if(r.state==='finished')return alert('이미 종료된 경주입니다.');if(!eligible(h,r))return alert('이 말은 해당 경주에 출전할 수 없습니다.');const conflict=state.registrations.find(x=>Number(x.horseId)===Number(hid)&&x.raceId!==rid&&state.races.some(rr=>rr.id===x.raceId&&rr.state!=='finished'&&Math.abs(dateIndex(rr.year,rr.month,rr.day)-dateIndex(r.year,r.month,r.day))<8));if(conflict)return alert('이 말은 8일 이내 다른 경주에 등록되어 있습니다.');const old=state.registrations.find(x=>x.raceId===rid);if(old){old.horseId=hid;old.jockeyId=jid}else state.registrations.push({raceId:rid,horseId:hid,jockeyId:jid});log(`${r.month}/${r.day} ${r.no}R 출전 등록 · ${h.name} · ${j.name}`);save();render()}
function deterministicField(r){const pool=[];state.npcs.forEach(n=>n.horses.filter(h=>eligible(h,r)).forEach(h=>pool.push(h)));state.horses.filter(h=>eligible(h,r)).forEach(h=>pool.push(h));return pool.sort((a,b)=>horseScore(b)-horseScore(a)).slice(0,12)}
function simulateRace(field,r,jid){return field.map(h=>{const j=Number(h.id)===Number(state.selectedHorse)?getJockey(jid):null;let s=recommend(h,r)+rnd(-35,35)/10;s+=(j?jockeyCompat(h,r,j):0);return{h,s}}).sort((a,b)=>b.s-a.s)}

function buildNpcRanches(){state.npcs=[];const ranches=['청마목장','한빛목장','로열힐','서광목장','그린필드','블루리본','골든브릿지','선샤인팜'];ranches.forEach((name,idx)=>{const hs=[];for(let k=0;k<18;k++){const a=rnd(2,7),rec=initialCareer(a);hs.push(makeHorse(a,{name:uniqueHorseName(`${name.slice(0,2)}${pick(['스타','킹','퀸','로드','윈드'])}`),...rec,imageId:51+((idx*18+k)%100)}))}state.npcs.push({name,horses:hs})});}
function setupStarterWorld(){state.pool=[];state.horses=[];state.selectedStart=[];state.startPage=0;state.nextId=1;state.starterGuideSeen=false;state.starterSetupVersion=STARTER_SETUP_VERSION;buildStarterPedigreeArchive();for(const bp of STARTER_BLUEPRINTS)state.pool.push(fixedStarterHorse(bp));state.guideHorseId=state.pool.find(h=>h.starterRole==='guide')?.id||null;buildNpcRanches();}

const _baseSeed=seed;
seed=function(){state.pool=[];state.horses=[];state.npcs=[];state.registrations=[];state.breedings=[];state.results=[];state.ranchName='';state.money=50000000;state.year=1;state.month=1;state.day=1;state.reputation=0;state.breedingCredits=2;state.stalls=8;state.startDone=false;state.tab='start';state.log=[];setupStarterWorld();generateRaces();normalize();log('새로운 목장을 시작하세요. 안내마를 확인한 뒤 첫 동반마 2마리를 선택합니다.');save();render();};

const _baseNormalizeStarter=normalize;
normalize=function(){state.pedigreeArchive=Array.isArray(state.pedigreeArchive)?state.pedigreeArchive:[];state.starterGuideSeen=!!state.starterGuideSeen;state.startTutorialActive=!!state.startTutorialActive;_baseNormalizeStarter();if(!state.startDone&&Number(state.starterSetupVersion)!==STARTER_SETUP_VERSION){const keepName=state.ranchName,keepMoney=state.money;setupStarterWorld();state.ranchName=keepName||'';state.money=Number(keepMoney)||50000000;state.starterSetupVersion=STARTER_SETUP_VERSION;}for(const h of [...(state.horses||[]),...(state.pool||[])]){if(h.fatherId){const f=pedigreeEntity(h.fatherId);if(f)h.parents.sire=f.name}if(h.motherId){const m=pedigreeEntity(h.motherId);if(m)h.parents.dam=m.name}}state.version=VERSION;};

function starterGuideHorse(){return state.pool.find(h=>h.id===state.guideHorseId)||state.pool.find(h=>h.starterRole==='guide')||null;}
function starterCandidates(){return state.pool.filter(h=>h.starterRole==='candidate');}
function ackStarterGuide(){if(!state.ranchName)return alert('먼저 목장 이름을 저장하세요.');state.starterGuideSeen=true;save();render();}

function starterComposition(){const hs=state.selectedStart.map(id=>state.pool.find(h=>h.id===id)).filter(Boolean),sex={암:0,수:0},ages={},bands={};for(const h of hs){sex[h.gender]=(sex[h.gender]||0)+1;ages[age(h)]=(ages[age(h)]||0)+1;bands[h.distanceBand]=(bands[h.distanceBand]||0)+1}const bits=[];if(hs.length){bits.push(`암말 ${sex.암||0} · 수말 ${sex.수||0}`);bits.push(Object.entries(ages).sort((a,b)=>a[0]-b[0]).map(([a,n])=>`${a}세 ${n}`).join(' · '));bits.push(Object.entries(bands).map(([b,n])=>`${b} ${n}`).join(' · '));}return bits;}
startCostTotal=function(){return state.selectedStart.reduce((sum,id)=>sum+recruitPrice(state.pool.find(h=>h.id===id)),0);};
toggleStart=function(id){const h=state.pool.find(x=>x.id===Number(id));if(!h||h.starterRole!=='candidate')return;if(state.selectedStart.includes(id))state.selectedStart=state.selectedStart.filter(x=>x!==id);else if(state.selectedStart.length<2)state.selectedStart.push(id);else return alert('첫 동반마는 2마리까지 선택할 수 있습니다.');save();render();};
confirmStart=function(){const total=startCostTotal(),guide=starterGuideHorse(),chosen=state.pool.filter(h=>state.selectedStart.includes(h.id)&&h.starterRole==='candidate');if(!state.ranchName)return alert('먼저 목장 이름을 저장하세요.');if(!state.starterGuideSeen)return alert('안내마의 기본 안내를 먼저 확인하세요.');if(chosen.length!==2)return alert('첫 동반마 2마리를 선택하세요.');if(!guide)return alert('안내마 데이터를 찾을 수 없습니다.');if(total>state.money)return alert('선택한 말의 영입 비용이 보유 자금을 초과합니다.');state.money-=total;state.horses=[guide,...chosen];const leftover=state.pool.filter(h=>h.starterRole==='candidate'&&!state.selectedStart.includes(h.id));leftover.forEach((h,i)=>state.npcs[i%state.npcs.length].horses.push(h));state.pool=[];state.startDone=true;state.startTutorialActive=true;state.tab='dashboard';state.selectedStart=[];log(`${state.ranchName} 목장이 시작되었습니다. 안내마 ${guide.name}와 첫 동반마 ${chosen.map(h=>h.name).join(', ')} · 영입 ${money(total)}`);save();render();};

startCard=function(h){const selected=state.selectedStart.includes(h.id);return `<div class="card horseCard ${selected?'selected':''}"><div class="between"><div class="name">${escapeHtml(h.name)}</div><span class="badge">${genderLabel(h)}</span></div><div class="horseImgWrap"><img class="horseImg" src="${imgFor(h)}" alt="${escapeHtml(h.name)}"></div><div class="mini">${age(h)}세 · ${h.color} · ${h.distanceBand} · ${h.style}</div>${starterTraitHtml(h)}<div class="stat"><span>전적</span><b>${h.starts}전 ${h.wins}승</b></div><div class="stat"><span>부 / 모</span><b>${escapeHtml(pedigreeName(h.fatherId,h.parents?.sire))} / ${escapeHtml(pedigreeName(h.motherId,h.parents?.dam))}</b></div><div class="stat"><span>영입 비용</span><b class="goldText">${money(recruitPrice(h))}</b></div><div class="row" style="margin-top:7px"><button class="action ${selected?'gold':'gray'}" style="flex:1" onclick="toggleStart(${h.id})">${selected?'✓ 선택됨':'선택'}</button><button class="action gray" onclick="horseDetailFromPool(${h.id})">상세정보</button></div></div>`;};

intro=function(){const total=startCostTotal(),remain=state.money-total,guide=starterGuideHorse(),comps=starterComposition();const guideBlock=state.ranchName&&guide?`<div class="panel"><div class="panelTitle"><div><h2>2. 첫 경주마 만나기</h2><div class="small">${escapeHtml(guide.name)}는 튜토리얼용 임시 NPC가 아니라 앞으로 계속 함께할 실제 보유마입니다.</div></div><span class="badge">안내마</span></div><div class="starterGuideCard"><div class="horseImgWrap"><img class="horseImg" src="${imgFor(guide)}" alt="${escapeHtml(guide.name)}"></div><div><div class="between"><h2 style="margin:0;color:#f4e1a7">${escapeHtml(guide.name)}</h2><span class="badge">${genderLabel(guide)} · ${age(guide)}세</span></div><div class="small" style="margin-top:4px">${guide.color} · ${guide.distanceBand} · ${guide.style}</div>${starterTraitHtml(guide)}<div class="stat"><span>전적</span><b>${guide.starts}전 ${guide.wins}승</b></div><div class="stat"><span>부 / 모</span><b>${escapeHtml(pedigreeName(guide.fatherId))} / ${escapeHtml(pedigreeName(guide.motherId))}</b></div><div class="notice good"><b>다음으로 해볼 일</b><div class="guideSteps"><div><b>1</b> 상세정보와 혈통 확인</div><div><b>2</b> 목장 시작 후 가벼운 조교</div><div><b>3</b> 컨디션 확인</div><div><b>4</b> 목표 경주와 출전 준비</div><div><b>5</b> 기수 선택</div><div><b>6</b> 경주와 결과 확인</div></div></div><div class="row"><button class="action gray" onclick="horseDetailFromPool(${guide.id})">상세정보 확인</button><button class="action gold" onclick="ackStarterGuide()">${state.starterGuideSeen?'✓ 기본 안내 확인됨':'안내 확인하고 후보 보기'}</button></div></div></div></div>`:`<div class="panel starterLocked"><div class="panelTitle"><h2>2. 첫 경주마 만나기</h2><span class="badge">잠김</span></div><div class="notice">목장 이름을 먼저 저장하면 안내마가 공개됩니다.</div></div>`;const candidateBlock=state.starterGuideSeen?`<div class="panel"><div class="panelTitle"><div><h2>3. 첫 동반마 2마리 선택</h2><div class="small">정확한 능력치는 숨겨져 있습니다. 성장, 적성, 장단점과 혈통을 보고 목장의 시작을 정하세요.</div></div><span class="badge">${state.selectedStart.length}/2 선택</span></div><div class="grid starterCandidateGrid">${starterCandidates().map(startCard).join('')}</div></div><div class="panel" style="margin-top:12px;position:sticky;bottom:8px;z-index:5"><div class="between"><div><div class="small">선택 말 영입비</div><b class="goldText" style="font-size:20px">${money(total)}</b><span class="small" style="margin-left:8px">현재 자금 ${money(state.money)} · 영입 후 ${money(remain)}</span>${comps.length?`<div class="starterSummary">${comps.map(x=>`<span class="badge">${escapeHtml(x)}</span>`).join('')}</div>`:''}</div><button class="action gold" style="min-width:190px" onclick="confirmStart()" ${state.selectedStart.length===2&&total<=state.money?'':'disabled'}>목장 운영 시작</button></div><div class="small" style="margin-top:8px">선택을 강제하지 않습니다. 향후 번식을 생각한다면 암말을 포함하는 것도 한 가지 선택입니다.</div></div>`:'';return `<div class="hero"><div class="heroText"><h2>당신만의 목장을 시작하세요</h2><p>안내마와 함께 기본 흐름을 확인하고, 서로 다른 혈통의 고정 후보 8마리 중 2마리를 선택해 총 3마리로 목장을 시작합니다.</p></div></div><div class="starterFlow"><div class="panel" style="margin-top:12px"><div class="panelTitle"><h2>1. 목장 이름</h2><span class="badge">게임 시작 전 설정</span></div><div class="row"><input id="ranchName" value="${escapeHtml(state.ranchName)}" placeholder="예: 블루리본 목장" style="flex:1;min-width:250px;background:#0e1115;color:#fff;border:1px solid #555b64;padding:10px;border-radius:6px"><button class="action gold" onclick="setRanchName()">이름 저장</button></div>${state.ranchName?`<div class="notice good">현재 목장: <b>${escapeHtml(state.ranchName)}</b></div>`:''}</div>${guideBlock}${candidateBlock}</div>`;};

const PROFILE_STAT_KEYS=['speed','power','stamina','sustain','cornering','response'];

function blankProfileStats(){return{speed:null,power:null,stamina:null,sustain:null,cornering:null,response:null,growthPotential:null,growthStage:null}}
function ensureProfileData(h){
  if(!h.profileStats||typeof h.profileStats!=='object')h.profileStats=blankProfileStats();
  PROFILE_STAT_KEYS.forEach(k=>{if(!(k in h.profileStats))h.profileStats[k]=null});
  if(!('growthPotential' in h.profileStats))h.profileStats.growthPotential=null;
  if(!('growthStage' in h.profileStats))h.profileStats.growthStage=null;
  h.bodyInfo=h.bodyInfo&&typeof h.bodyInfo==='object'?h.bodyInfo:{weight:null,build:null,height:null,stride:null};
  ['weight','build','height','stride'].forEach(k=>{if(!(k in h.bodyInfo))h.bodyInfo[k]=null});
  h.profileTraits=h.profileTraits&&typeof h.profileTraits==='object'?h.profileTraits:{};
  const t=h.profileTraits;
  if(!('distanceCategory' in t))t.distanceCategory=t.distance||h.distanceBand||null;
  if(!('distanceMin' in t))t.distanceMin=null;
  if(!('distanceMax' in t))t.distanceMax=null;
  if(!t.surfaceAffinity||typeof t.surfaceAffinity!=='object')t.surfaceAffinity={turf:null,dirt:null};
  if(!('turf' in t.surfaceAffinity))t.surfaceAffinity.turf=null;
  if(!('dirt' in t.surfaceAffinity))t.surfaceAffinity.dirt=null;
  if(!Array.isArray(t.preferredTactics))t.preferredTactics=t.preferredTactic?[t.preferredTactic]:(h.style?[h.style]:[]);
  if(!('personality' in t))t.personality=null;
  if(!('temperament' in t))t.temperament=null;
  if(!Array.isArray(t.strengthCategories))t.strengthCategories=[];
  if(!Array.isArray(t.weaknessCategories))t.weaknessCategories=[];
  if(!('strengthText' in t))t.strengthText=t.strength||h.strength||null;
  if(!('weaknessText' in t))t.weaknessText=t.weakness||h.weakness||null;
  if(!('preferredJockeyId' in t))t.preferredJockeyId=null;
  if(!('birthDate' in h))h.birthDate=null;
  if(!('birthRanch' in h))h.birthRanch=null;
  if(!('rating' in h))h.rating=null;
  if(!Array.isArray(h.raceReviews))h.raceReviews=[];
  return h;
}
function blankJockeyAbilities(){return{start:null,paceJudgement:null,positioning:null,routeJudgement:null,cornerHandling:null,crisisResponse:null,planExecution:null}}
function ensureJockeyData(j){
  j.profile=j.profile&&typeof j.profile==='object'?j.profile:{};
  const p=j.profile;
  if(!('age' in p))p.age=null;
  if(!('careerYears' in p))p.careerYears=null;
  if(!('weight' in p))p.weight=null;
  if(!('reputation' in p))p.reputation=null;
  if(!p.abilities||typeof p.abilities!=='object')p.abilities=blankJockeyAbilities();
  JOCKEY_PROFILE_ABILITY_KEYS.forEach(k=>{if(!(k in p.abilities))p.abilities[k]=null});
  if(!p.traits||typeof p.traits!=='object')p.traits={};
  if(!Array.isArray(p.traits.preferredTactics))p.traits.preferredTactics=(j.style||[]).filter(x=>x!=='자유');
  if(!Array.isArray(p.traits.preferredDistances))p.traits.preferredDistances=[...(j.bands||[])];
  if(!('operatingStyle' in p.traits))p.traits.operatingStyle=null;
  return j;
}
function ensureRelationStore(){if(!state.horseJockeyRelations||typeof state.horseJockeyRelations!=='object'||Array.isArray(state.horseJockeyRelations))state.horseJockeyRelations={};return state.horseJockeyRelations}
function horseJockeyRelationKey(horseId,jockeyId){return `${Number(horseId)}::${String(jockeyId)}`}
function horseJockeyRelation(horseId,jockeyId,create=false){const store=ensureRelationStore(),key=horseJockeyRelationKey(horseId,jockeyId);if(!store[key]&&create)store[key]={horseId:Number(horseId),jockeyId:String(jockeyId),friendship:null,rides:0,wins:0,seconds:0,thirds:0,majorWins:[],preferred:false};return store[key]||null}
function recordHorseJockeyResult(horseId,jockeyId,res){if(!horseId||!jockeyId||!res)return;const rel=horseJockeyRelation(horseId,jockeyId,true);rel.rides=(Number(rel.rides)||0)+1;if(Number(res.place)===1)rel.wins=(Number(rel.wins)||0)+1;if(Number(res.place)===2)rel.seconds=(Number(rel.seconds)||0)+1;if(Number(res.place)===3)rel.thirds=(Number(rel.thirds)||0)+1;const grade=String(res.grade||'');if(Number(res.place)===1&&/^G[123]$/i.test(grade)){rel.majorWins=Array.isArray(rel.majorWins)?rel.majorWins:[];rel.majorWins.push({raceId:res.raceId||null,grade,date:`${res.year}.${res.month}.${res.day}`})}}

function profileRanch(h){if(ownedHorse(h))return state.ranchName||'현재 목장';for(const n of state.npcs){if((n.horses||[]).some(x=>Number(x.id)===Number(h.id)))return n.name}return state.startDone?'소속 정보 없음':'영입 전'}
function profileGrandName(parentId,side,key){const p=allHorseObjects().find(x=>Number(x.id)===Number(parentId));if(p){const id=key==='sire'?p.fatherId:p.motherId;const gp=allHorseObjects().find(x=>Number(x.id)===Number(id));if(gp)return gp.name;const label=p.parents?.[key];if(label)return label}const fallback=hPedFallback(side,key);return fallback}

function pedNameById(id,fallback){const p=typeof pedigreeEntity==='function'?pedigreeEntity(id):allHorseObjects().find(x=>Number(x.id)===Number(id));return p?.name||fallback||'정보 없음'}

function grandName(parent,key){if(!parent)return'정보 없음';const id=key==='sire'?parent.fatherId:parent.motherId;const found=parentObject(id);return found?.name||parent.parents?.[key]||'정보 없음'}
function horseResults(h){return (state.results||[]).filter(x=>Number(x.horseId)===Number(h.id)).slice().sort((a,b)=>dateIndex(b.year,b.month,b.day)-dateIndex(a.year,a.month,a.day))}
function totalPrize(h){const rows=horseResults(h);if(rows.length)return rows.reduce((a,x)=>a+(Number(x.payout)||0),0);return (h.history||[]).reduce((a,x)=>a+(Number(x.payout)||0),0)}
function raceDetailRows(h){const fromResults=horseResults(h);if(fromResults.length)return fromResults.map(x=>{const r=(state.races||[]).find(q=>q.id===x.raceId);return{date:`${x.year}.${String(x.month).padStart(2,'0')}.${String(x.day).padStart(2,'0')}`,name:x.grade||r?.grade||'경주',dist:x.dist||r?.dist||null,surface:r?.surface||null,place:x.place,time:x.time||null,payout:x.payout||0,jockey:x.jockey||null,reviews:Array.isArray(x.reviews)?x.reviews.slice(0,3):[]}});return (h.history||[]).map(x=>({date:`${x.year}.${String(x.month).padStart(2,'0')}.${String(x.day).padStart(2,'0')}`,name:x.grade||'경주',dist:x.dist||null,surface:null,place:x.place,time:null,payout:x.payout||0,jockey:x.jockey||null,reviews:Array.isArray(x.reviews)?x.reviews.slice(0,3):[]}))}
function jockeyRecords(h){const map=new Map();raceDetailRows(h).forEach(x=>{if(!x.jockey)return;const j=JOCKEYS.find(q=>q.name===x.jockey)||null,o=map.get(x.jockey)||{id:j?.id||null,name:x.jockey,rides:0,wins:0,seconds:0,thirds:0};o.rides++;if(x.place===1)o.wins++;if(x.place===2)o.seconds++;if(x.place===3)o.thirds++;map.set(x.jockey,o)});return[...map.values()].map(o=>{const rel=o.id?horseJockeyRelation(h.id,o.id,false):null;return{...o,friendship:rel?.friendship??null}})}
function profileInfoItem(label,value){const empty=value===null||value===undefined||value==='';return `<div class="profileInfoItem"><div class="label">${escapeHtml(label)}</div><div class="value ${empty?'profileEmpty':''}">${empty?'미설정':escapeHtml(value)}</div></div>`}

function profileRecordsTab(h){const rows=raceDetailRows(h),recent=rows.slice(0,5),major=rows.filter(x=>x.place===1&&/^G[123]$/i.test(String(x.name))).slice(0,8),jrs=jockeyRecords(h);const latestReviews=rows.find(x=>x.reviews?.length)?.reviews||[];return `<div class="profileSection"><div class="recordHero"><div class="ratingCard"><div><div class="ratingLabel">현재 레이팅</div><div class="ratingValue">${h.rating===null||h.rating===undefined?'미산정':escapeHtml(h.rating)}</div></div></div><div class="recordStats"><div class="recordStat"><b>${h.starts||0}</b><span>출전</span></div><div class="recordStat"><b>${h.wins||0}</b><span>1착</span></div><div class="recordStat"><b>${h.seconds||0}</b><span>2착</span></div><div class="recordStat"><b>${h.thirds||0}</b><span>3착</span></div><div class="recordStat"><b>${money(totalPrize(h))}</b><span>총상금</span></div></div></div></div><div class="profileSection"><h3>최근전적</h3>${recent.length?`<div class="profileTableWrap"><table class="profileTable"><thead><tr><th>날짜</th><th>경주</th><th>거리</th><th>주로</th><th>착순</th></tr></thead><tbody>${recent.map(x=>`<tr><td>${x.date}</td><td>${escapeHtml(x.name)}</td><td>${x.dist?`${x.dist}m`:'-'}</td><td>${x.surface?escapeHtml(x.surface):'-'}</td><td>${x.place?`${x.place}착`:'-'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="muted">기록 없음</div>'}</div><div class="profileSection"><h3>주요우승</h3>${major.length?major.map(x=>`<div class="stat"><span>${x.date} · ${escapeHtml(x.name)} ${x.dist?`${x.dist}m`:''}</span><b>1착</b></div>`).join(''):'<div class="muted">주요 우승 기록 없음</div>'}</div><div class="profileSection"><h3>개별경주기록</h3>${rows.length?`<div class="profileTableWrap"><table class="profileTable"><thead><tr><th>날짜</th><th>경주명</th><th>거리</th><th>주로</th><th>착순</th><th>기록</th><th>상금</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.date}</td><td>${escapeHtml(x.name)}</td><td>${x.dist?`${x.dist}m`:'-'}</td><td>${x.surface?escapeHtml(x.surface):'-'}</td><td>${x.place?`${x.place}착`:'-'}</td><td>${x.time?escapeHtm /* HORSE RANCH 20.1 opening alignment patch.
 * Applies ONLY to freshly created games. Existing saved games, including
 * incomplete legacy openings, remain on their own original progression.
 * Affects no existing training, breeding, economy, or long-form race rules.
 */
const HR_OPENING_2026_MODE = 'five-mares-pick-two';
const HR_OPENING_2026_KEYS = ['mile_arc','mile_velvet','mile_misty','sprint_royal','sprint_storm'];
const HR_OPENING_RACE_TYPES = [
  {id:OPENING_RACE_ID,dist:2000,prize:5000000},
  {id:'opening-1600',dist:1600,prize:5000000},
  {id:'opening-2400',dist:2400,prize:5000000}
];
const _hrLegacySetupOpeningWorld2026 = setupOpeningWorld;
setupOpeningWorld = function(preserveName=false){
  _hrLegacySetupOpeningWorld2026(preserveName);
  state.openingChoiceMode = HR_OPENING_2026_MODE;
  state.openingMareChoices = [];
  state.openingCandidateIds = HR_OPENING_2026_KEYS.map(k=>state.pool.find(h=>h.openingKey===k || h.key===k)?.id).filter(Boolean);
  if(state.openingCandidateIds.length !== 5){
    // The source blueprint may not persist the key. Use the stable blueprint
    // order for 20.1: starter, five mile candidates, five sprint candidates.
    const ordered = state.pool.filter(h=>h.gender==='암');
    state.openingCandidateIds = [0,1,3,5,8].map(i=>ordered[i]?.id).filter(Boolean);
  }
  state.openingSelectedRaceId = null;
  state.openingSelectedJockeyId = null;
  const first=openingRace();
  if(first){
    Object.assign(first,{grade:'일반',prize:5000000,opening:true});
    for(const choice of HR_OPENING_RACE_TYPES.slice(1)){
      state.races.unshift({...first,id:choice.id,dist:choice.dist,band:band(choice.dist),prize:choice.prize,state:'open'});
    }
  }
};
function hr2026NewOpening(){return state.openingChoiceMode===HR_OPENING_2026_MODE&&!state.startDone}
function hr2026OpeningRaces(){return HR_OPENING_RACE_TYPES.map(o=>state.races.find(r=>r.id===o.id)).filter(Boolean)}
function hr2026SelectedRace(){return hr2026OpeningRaces().find(r=>r.id===state.openingSelectedRaceId)||null}
function hr2026SelectedJockey(){return getJockey(state.openingSelectedJockeyId)||null}
function hr2026AvailableMares(){const ids=Array.isArray(state.openingCandidateIds)?state.openingCandidateIds:[];return ids.map(id=>state.pool.find(h=>h.id===id)).filter(h=>h&&h.gender==='암')}
function hr2026SetRace(id){if(!hr2026NewOpening()||state.openingStage!=='race')return;if(!hr2026OpeningRaces().some(r=>r.id===id))return;state.openingSelectedRaceId=id;save();render()}
function hr2026SetJockey(id){if(!hr2026NewOpening()||state.openingStage!=='race')return;if(!getJockey(id))return;state.openingSelectedJockeyId=id;save();render()}
const _hrLegacyRegisterOpeningRace2026=registerOpeningRace;
registerOpeningRace=function(){
  if(!hr2026NewOpening())return _hrLegacyRegisterOpeningRace2026();
  if(state.openingStage!=='race')return;
  const r=hr2026SelectedRace(),j=hr2026SelectedJockey(),h=openingStarter();
  if(!r||!j||!h)return alert('경주와 기수를 선택하세요.');
  if(!eligible(h,r))return alert('선택한 경주의 출전 조건을 충족하지 못합니다.');
  state.selectedRace=r.id;state.selectedHorse=h.id;state.selectedJockey=j.id;
  state.openingRaceRegistered=true;state.openingStage='race_registered';
  if(!state.registrations.some(x=>x.raceId===r.id&&x.horseId===h.id))state.registrations.push({raceId:r.id,horseId:h.id,jockeyId:j.id});
  log(`첫 경주 출전 등록 · ${r.dist}m · ${h.name} · ${j.name}`);save();render();
};
const _hrLegacyRunOpeningRace2026=runOpeningRace;
runOpeningRace=function(){
  if(!hr2026NewOpening())return _hrLegacyRunOpeningRace2026();
  if(state.openingStage!=='race_registered'||state.openingRaceCompleted)return;
  const r=hr2026SelectedRace(),h=openingStarter(),j=hr2026SelectedJockey();
  if(!r||!h||!j)return alert('출전 정보를 확인할 수 없습니다.');
  const before=state.results.length;
  state.selectedHorse=h.id;
  runRace(r.id,j.id,false); // Reuse the existing ordinary race calculation and relationship recording.
  if(state.results.length!==before+1)return;
  state.openingRaceCompleted=true;state.openingStage='race_result';
  state.openingRaceResultId=r.id;
  state.races=state.races.filter(x=>!HR_OPENING_RACE_TYPES.some(o=>o.id===x.id)||x.id===r.id);
  const result=state.results[state.results.length-1];
  log(`${h.name} 첫 경주 ${result.place}착 · ${r.dist}m · ${j.name}`);
  save();render();
  const horses=allHorseObjects();
  const scored=(r.result||[]).map((x,i)=>({h:horses.find(a=>Number(a.id)===Number(x.horseId)),s:100-i})).filter(x=>x.h);
  if(scored.length)showRace(r,scored,h,result.place,result.payout,j);
};
const _hrLegacyContinueOpening2026=continueAfterOpeningRace;
continueAfterOpeningRace=function(){
  if(!hr2026NewOpening())return _hrLegacyContinueOpening2026();
  if(!state.openingRaceCompleted)return alert('첫 경주 결과를 먼저 확인하세요.');
  state.openingStage='mares';save();render();
};
const _hrLegacySelectOpeningCandidate2026=selectOpeningCandidate;
selectOpeningCandidate=function(id){
  if(!hr2026NewOpening())return _hrLegacySelectOpeningCandidate2026(id);
  if(state.openingStage!=='mares')return;
  const horseId=Number(id);
  if(!hr2026AvailableMares().some(h=>h.id===horseId))return;
  const selected=Array.isArray(state.openingMareChoices)?state.openingMareChoices:[];
  state.openingMareChoices=selected.includes(horseId)?selected.filter(x=>x!==horseId):selected.length<2?[...selected,horseId]:selected;
  save();render();
};
function hr2026FinishMareChoice(){
  if(!hr2026NewOpening()||state.openingStage!=='mares')return;
  const picked=(state.openingMareChoices||[]).map(id=>hr2026AvailableMares().find(h=>h.id===id)).filter(Boolean);
  if(picked.length!==2||picked[0].id===picked[1].id)return alert('후보 5마리 중 서로 다른 암말 2마리를 선택하세요.');
  const cost=picked.reduce((n,h)=>n+recruitPrice(h),0);
  if(cost>state.money)return alert('보유 자금이 부족합니다.');
  state.money-=cost;
  state.horses.push(...picked);
  state.pool=state.pool.filter(h=>!picked.some(x=>x.id===h.id));
  const otherCandidates=state.pool.filter(h=>h.openingGroup==='mile'||h.openingGroup==='sprint');
  if(state.npcs.length)otherCandidates.forEach((h,i)=>state.npcs[i%state.npcs.length].horses.push(h));
  state.pool=state.pool.filter(h=>!otherCandidates.includes(h));
  state.startDone=true;state.openingStage='complete';state.startTutorialActive=true;
  state.tab='dashboard';state.selectedStart=[];
  log(`${state.ranchName} 목장 시작 · 고정 수말 1마리, 선택 암말 2마리 · 영입 비용 ${money(cost)}`);
  save();render();
}
const _hrLegacyIntro2026=intro;
intro=function(){
  if(!hr2026NewOpening())return _hrLegacyIntro2026();
  const stage=state.openingStage||'ranch',h=openingStarter(),r=hr2026SelectedRace(),j=hr2026SelectedJockey();
  if(!['race','race_registered','race_result','mares'].includes(stage))return _hrLegacyIntro2026().replace('마일 암말과 단거리 암말을 한 마리씩 영입합니다.','암말 후보 5마리 중 원하는 2마리를 선택합니다.');
  const header=`<div class="hero"><div class="heroText"><h2>${escapeHtml(state.ranchName||'HORSE RANCH')} · 첫 목장을 시작합니다</h2><p>고정 수말과 첫 경주를 경험한 후 암말 5마리 중 2마리를 영입합니다.</p></div></div>`;
  let body='';
  if(stage==='race'){
    body=`<div class="panel"><div class="panelTitle"><div><h2>첫 경주 선택</h2><div class="small">경주와 기수를 직접 선택하고 출전을 등록하세요.</div></div></div><div class="grid"><div class="card"><h3>출전 경주</h3><select id="hr2026RaceSelect" onchange="hr2026SetRace(this.value)" style="width:100%;padding:10px;background:#13171d;color:#fff;border:1px solid #666"><option value="">경주를 선택하세요</option>${hr2026OpeningRaces().map(x=>`<option value="${escapeHtml(x.id)}" ${r?.id===x.id?'selected':''}>${x.dist}m · ${escapeHtml(x.surface)} · ${escapeHtml(x.grade)} · ${money(x.prize)}</option>`).join('')}</select></div><div class="card"><h3>기수 선택</h3><select id="hr2026JockeySelect" onchange="hr2026SetJockey(this.value)" style="width:100%;padding:10px;background:#13171d;color:#fff;border:1px solid #666"><option value="">기수를 선택하세요</option>${JOCKEYS.map(x=>`<option value="${escapeHtml(x.id)}" ${j?.id===x.id?'selected':''}>${escapeHtml(x.name)} · 능력 ${x.skill}</option>`).join('')}</select></div></div><div class="notice">출전마: <b>${escapeHtml(h?.name||'-')}</b> (고정 수말) · 선택한 경주 결과는 기존 경주 기록에 저장됩니다.</div><button class="action gold" style="width:100%;margin-top:10px" onclick="registerOpeningRace()" ${r&&j?'':'disabled'}>출전 등록</button></div>`;
  }else if(stage==='race_registered'){
    body=`<div class="panel"><h2>출전 등록 완료</h2><div class="notice good">${escapeHtml(h?.name||'-')} × ${escapeHtml(j?.name||'-')} · ${r?.dist||'-'}m</div><button class="action green" style="width:100%;margin-top:10px" onclick="runOpeningRace()">첫 경주 시작</button></div>`;
  }else if(stage==='race_result'){
    const rr=state.races.find(x=>x.id===state.openingRaceResultId),saved=state.results.find(x=>x.raceId===state.openingRaceResultId&&x.horseId===h?.id);
    body=`<div class="panel"><h2>첫 경주 결과</h2><div class="grid"><div class="card"><div class="stat"><span>경주</span><b>${rr?.dist||'-'}m · ${escapeHtml(rr?.surface||'잔디')}</b></div><div class="stat"><span>출전마</span><b>${escapeHtml(h?.name||'-')}</b></div><div class="stat"><span>기수</span><b>${escapeHtml(saved?.jockey||'-')}</b></div></div><div class="card"><div class="stat"><span>착순</span><b>${saved?.place||'-'}착</b></div><div class="stat"><span>기록</span><b>${saved?.time||'-'}초</b></div><div class="stat"><span>상금</span><b>${money(saved?.payout||0)}</b></div></div></div><button class="action gold" style="width:100%;margin-top:10px" onclick="continueAfterOpeningRace()">암말 후보 5마리 보기</button></div>`;
  }else if(stage==='mares'){
    const candidates=hr2026AvailableMares(),ids=state.openingMareChoices||[],picked=candidates.filter(h=>ids.includes(h.id)),cost=picked.reduce((n,h)=>n+recruitPrice(h),0);
    body=`<div class="panel"><div class="panelTitle"><div><h2>암말 후보 5마리 중 2마리 선택</h2><div class="small">거리 구분에 관계없이 원하는 암말 두 마리를 선택할 수 있습니다. 자세한 수치는 기존 상세정보에서 확인하세요.</div></div><span class="badge">${picked.length}/2 선택</span></div><div class="grid starterCandidateGrid">${candidates.map(x=>openingCandidateCard(x,ids.includes(x.id))).join('')}</div></div><div class="panel" style="margin-top:12px;position:sticky;bottom:8px;z-index:5"><div class="between"><div><b class="goldText">선택 비용 ${money(cost)}</b><div class="small">남는 자금 ${money(state.money-cost)} · 시작 보유마 ${1+picked.length}마리</div></div><button class="action gold" onclick="hr2026FinishMareChoice()" ${picked.length===2&&cost<=state.money?'':'disabled'}>2마리 결정하고 목장 시작</button></div></div>`;
  }
  return `${header}<div class="panel" style="margin-top:12px"><div class="small">오프닝 · 목장 이름 → 고정 수말 → 경주 선택/등록 → 결과 → 암말 2마리 선택</div></div><div class="starterFlow" style="margin-top:12px">${body}</div>`;
};

if(!load())seed();else normalize();render();
</script>
<script>
/* HORSE RANCH race system v1.
 * Pure computational system. It never mutates input horse objects, financial
 * state, the DOM, or saved games. Works without images/3D.
 */
(function(root) {
  'use strict';
  const VERSION = 'time-step-1';
  const TACTICS = ['도주','선행','선입','추입'];
  const BANDS = ['단거리','마일','중거리','장거리','초장거리'];
  const clamp = (n,a,b) => Math.max(a,Math.min(b,n));
  const numeric = (v,defaultValue) => Number.isFinite(Number(v)) && v !== null && v !== '' ? Number(v) : defaultValue;
  const round = (n,p=2) => Number(n.toFixed(p));
  function distanceBand(m) {return m<=1400?0:m===1600?1:m<=2400?2:m<=3200?3:4;}
  function hashText(text) {
    let h=2166136261;
    for(let i=0;i<text.length;i++) {h^=text.charCodeAt(i);h=Math.imul(h,16777619);}
    return h>>>0;
  }
  function randomStream(seed) {
    let state=seed || 0x9e3779b9;
    return function(){state^=state<<13;state^=state>>>17;state^=state<<5;return (state>>>0)/4294967296;};
  }
  function tacticalOffset(tactic,fraction) {
    const t=TACTICS.includes(tactic)?tactic:'선입';
    if(fraction<.20) return ({'도주':.44,'선행':.23,'선입':-.08,'추입':-.30})[t];
    if(fraction<.72) return ({'도주':.12,'선행':.07,'선입':.025,'추입':-.04})[t];
    return ({'도주':-.13,'선행':.05,'선입':.26,'추입':.43})[t];
  }
  function simulate(params) {
    if(!params || !params.race || !Array.isArray(params.entrants)) throw Error('경주와 출전마 데이터가 필요합니다.');
    const race=params.race;
    const distance=numeric(race.dist,0);
    if(distance<800 || distance>4000) throw Error('지원하지 않는 경주 거리입니다.');
    const entrants=params.entrants;
    if(entrants.length<2 || entrants.length>20) throw Error('출전마는 2~20마리여야 합니다.');
    const ids=entrants.map(e=>String(e.horse?.id));
    if(new Set(ids).size!==ids.length || ids.some(x=>x==='undefined')) throw Error('출전마 ID 중복 또는 누락');
    const seed = params.seed == null
      ? hashText(`${race.id||''}|${distance}|${race.surface||''}|${ids.join(',')}`)
      : (Number(params.seed)>>>0);
    const random=randomStream(seed);
    const raceBand=distanceBand(distance);
    const runners=entrants.map((entry,i)=>{
      const h=entry.horse, j=entry.jockey||null;
      const speed=numeric(h.speed,70), stamina=numeric(h.stamina,70), power=numeric(h.power,70);
      const cond=numeric(h.condition,82), fatigue=numeric(h.fatigue,0), hoof=numeric(h.hoof,100);
      const preferredBand=BANDS.indexOf(h.distanceBand);
      const gap=preferredBand===-1?0:Math.abs(preferredBand-raceBand);
      const mismatchedSurface=!!(h.surface && race.surface && h.surface!==race.surface);
      const goodStyle=!!(j && Array.isArray(j.style) && j.style.includes(h.style));
      const goodBand=!!(j && Array.isArray(j.bands) && j.bands.includes(BANDS[raceBand]));
      const jockeyPace=numeric(j?.pace,77), jockeyCorner=numeric(j?.corner,77), jockeyFinish=numeric(j?.finish,77);
      // A null/unknown friendship never silently becomes a numerical bonus.
      const friendship=entry.friendship == null ? null : clamp(numeric(entry.friendship,0),0,100);
      const base=16.2+(speed-70)*.042+(stamina-70)*.008+(cond-80)*.008-
        fatigue*.011-(100-hoof)*.005-gap*.29-(mismatchedSurface?.24:0)+
        (goodStyle?.075:0)+(goodBand?.04:0)+(j?(jockeyPace-77)*.0025:0);
      return {
        id:String(h.id),name:String(h.name||`출전마 ${i+1}`),horse:h,index:i,
        speedStat:speed, stamina, power,tactic:h.style,
        pos:0,velocity:0,energy:1,finish:null,base,
        acceleration:1.05+(power-70)*.012+(j?(numeric(j.skill,77)-77)*.003:0)+
          (friendship==null?0:(friendship-50)*.002),
        energyUsage:clamp(.76+(70-stamina)*.012,.50,1.15),
        cornerHandling:jockeyCorner,
        finishing:jockeyFinish,
        variation:(random()-.5)*.24,
        stridePhase:random()*Math.PI*2,
        lane:i%4
      };
    });
    const interval=.5;
    const sampleEvery=5;
    let step=0,time=0;
    const frames=[];
    function snapshot(t){frames.push({t:round(t,2),p:runners.map(x=>round(x.pos,1)),v:runners.map(x=>round(x.velocity,2))});}
    snapshot(0);
    while(runners.some(x=>x.finish===null) && step<1500) {
      const alive=runners.filter(x=>x.finish===null);
      const prior=alive.map(x=>x.pos);
      // Each horse's current physical position determines its current race phase.
      alive.forEach((x,index)=>{
        const fraction=clamp(x.pos/distance,0,1);
        const tactic=tacticalOffset(x.tactic,fraction);
        const corner=fraction>=.20&&fraction<=.27 || fraction>=.62&&fraction<=.73;
        const cornerPenalty=corner?clamp(.21-(x.cornerHandling-77)*.003, .08,.32):0;
        const noise=(Math.sin(time*.55+x.stridePhase)+Math.sin(time*.19+x.stridePhase*2))*.027;
        const energyPenalty=x.energy<.26?( .26-x.energy )*2.4:0;
        const finishAbility=fraction>.76?(x.finishing-77)*.003:0;
        const goal=clamp(x.base+tactic+x.variation+noise-cornerPenalty-energyPenalty+finishAbility,11.5,19.8);
        const accel=clamp(x.acceleration,.58,1.6)*interval;
        x.velocity=clamp(x.velocity+clamp(goal-x.velocity,-.23*interval,accel),0,20);
        x.pos=Math.min(distance,x.pos+x.velocity*interval);
        const pressure=1+Math.max(0,tactic)*.13;
        const totalExpectedTime=distance/16.2;
        x.energy=clamp(x.energy - interval/totalExpectedTime*x.energyUsage*pressure,0,1);
        if(x.pos>=distance) {
          const travelled=distance-prior[index];
          x.finish=round(time+interval*(travelled/Math.max(x.velocity*interval,.00001)),4);
        }
      });
      step++;
      time=round(step*interval,3);
      if(step%sampleEvery===0 || runners.every(x=>x.finish!==null)) snapshot(time);
    }
    if(runners.some(x=>x.finish===null)) throw Error('경주 시뮬레이션이 종료되지 않았습니다.');
    const result=runners.slice().sort((a,b)=>a.finish-b.finish || a.index-b.index);
    const results=result.map((r,i)=>({horseId:r.id,horseName:r.name,place:i+1,time:round(r.finish,2),lane:r.lane}));
    return {
      version:VERSION,seed,distance,surface:race.surface||null,
      stepSeconds:interval,frameSeconds:interval*sampleEvery,
      ids:runners.map(x=>x.id),names:runners.map(x=>x.name),
      frames,results,finishSeconds:round(Math.max(...runners.map(x=>x.finish)),2),
      explanation:'시간 단계별 위치·속도·지구력 기반 계산. 경기 그래픽/물리 인증과는 별도.'
    };
  }
  root.HorseRanchRaceEngine=Object.freeze({version:VERSION,simulate});
  if(typeof module!=='undefined' && module.exports)module.exports=root.HorseRanchRaceEngine;
})(typeof globalThis!=='undefined'?globalThis:this);

</script>
<script>
/* HORSE RANCH 20.1 compatible race adapter.
 * Preserves the old save key and all economic, record, registration and
 * onboarding flows. Only race calculation and replay change for NEW races.
 */
(function(){
  'use strict';
  const engine=window.HorseRanchRaceEngine;
  if(!engine) {console.error('HORSE RANCH: race engine unavailable; original race code retained.');return;}
  const oldSimulator=simulateRace;
  const oldRunRace=runRace;
  const oldShowRace=showRace;
  const oldResult=openRaceResult;
  const oldClose=closeModal;
  let playback=null;
  function cleanup(){if(playback?.timer)clearInterval(playback.timer);playback=null;}
  closeModal=function(){cleanup();return oldClose();};
  simulateRace=function(field,r,jid){
    try {
      const ownedId=Number(state.selectedHorse);
      const entrants=field.map(h=>{
        const own=Number(h.id)===ownedId;
        const j=own?getJockey(jid):null;
        const relation=own && j && typeof horseJockeyRelation==='function'
          ?horseJockeyRelation(h.id,j.id,false):null;
        return {horse:h,jockey:j,friendship:relation?.friendship??null};
      });
      const sim=engine.simulate({race:r,entrants});
      r.simulation=sim;
      const byId=new Map(field.map(h=>[String(h.id),h]));
      return sim.results.map(x=>({h:byId.get(String(x.horseId)),s:-x.time}));
    } catch(err) {
      // Legacy calculation is a safe fallback. Mark that no physical trace exists.
      delete r.simulation;
      console.error('HORSE RANCH race simulation fallback:',err);
      return oldSimulator(field,r,jid);
    }
  };
  runRace=function(rid,jid,show=true){
    const r=state.races.find(x=>x.id===rid);
    const before=state.results.length;
    const out=oldRunRace(rid,jid,false);
    if(!r || state.results.length===before)return out;
    if(r.simulation && r.simulation.version===engine.version){
      // Old 20.1 bookkeeping remains the only writer of prize, money, jockey
      // relationship and win counters; times now reflect actual crossing.
      const times=new Map(r.simulation.results.map(x=>[String(x.horseId),x.time]));
      for(const row of (r.result||[])){
        const actual=times.get(String(row.horseId));
        if(actual!==undefined)row.time=actual.toFixed(2);
      }
      const mine=state.results[state.results.length-1];
      const actual=times.get(String(mine.horseId));
      if(actual!==undefined){
        mine.time=actual.toFixed(2);
        mine.raceEngineVersion=engine.version;
      }
      save();
    }
    if(show){
      const saved=state.results[state.results.length-1];
      const map=new Map(allHorseObjects().map(h=>[String(h.id),h]));
      const scored=(r.result||[]).map((x,i)=>({h:map.get(String(x.horseId)),s:100-i})).filter(x=>x.h);
      showRace(r,scored,horse(saved.horseId),saved.place,saved.payout,getJockey(jid));
    }
    return out;
  };
  const css=document.createElement('style');
  css.textContent=`.hrs-track{background:#101b19;border:1px solid #536a57;border-radius:8px;padding:10px;max-height:55vh;overflow-y:auto}.hrs-row{display:grid;grid-template-columns:24px minmax(88px,150px) 1fr 62px;gap:6px;align-items:center;border-bottom:1px solid #394339;padding:6px 0;font-size:12px}.hrs-row.me{background:#51421b70;border-radius:5px}.hrs-line{position:relative;height:16px;background:repeating-linear-gradient(90deg,#224332 0%,#31543b 10%,#224332 20%);border-radius:8px;border-right:3px solid #fff;overflow:hidden}.hrs-progress{height:100%;background:linear-gradient(90deg,#458c64,#e3c16b);transition:width .12s linear}.hrs-controls{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:10px}.hrs-controls input[type=range]{flex:1;min-width:180px}.hrs-controls button{font-size:12px}.hrs-meta{font-size:12px;color:#d3d8d7;padding:7px 0}`;
  document.head.appendChild(css);
  function showPhysicalRace(r,player,place,payout,j){
    cleanup();
    const sim=r.simulation;
    const title=`${escapeHtml(r.grade)} · ${r.dist}m · 제1경마장`;
    $('modalRoot').innerHTML=`<div class="modal"><div class="modalBox"><div class="raceHeader"><div><h2 style="margin:0">${title}</h2><div class="small">${escapeHtml(r.surface||'')} · ${escapeHtml(r.weather||'')} · 시뮬레이션 ${escapeHtml(sim.version)}</div></div><button class="action gray" onclick="closeModal();render()">닫기</button></div><div class="notice">경주 결과는 실제 시간 단계별 이동 거리와 결승선 통과 시각에서 계산합니다. 현재 화면은 향후 3D 모델과 독립적인 임시 진행도입니다.</div><div class="between"><b id="hrs-phase">출발 준비</b><span id="hrs-clock">0.0초 / ${sim.finishSeconds}초</span></div><div class="hrs-track" id="hrs-track"></div><div class="hrs-controls"><button class="action" onclick="hrRaceReplayPause()" id="hrs-playbtn">일시정지</button><label class="small">속도 <select id="hrs-speed" onchange="hrRaceReplaySetSpeed(Number(this.value))" style="background:#1c2228;color:#fff"><option value="1">1배</option><option value="4" selected>4배</option><option value="12">12배</option></select></label><input aria-label="경주 시간 이동" type="range" id="hrs-seek" min="0" max="${sim.frames.length-1}" value="0" oninput="hrRaceReplayJump(Number(this.value))"><button class="action gold" onclick="hrRaceReplayJump(${sim.frames.length-1})">결승 확인</button></div><div class="leaderboard" id="hrs-summary" style="margin-top:10px">각 말이 출발 위치에서 대기하고 있습니다.</div></div></div>`;
    playback={sim,index:0,playing:true,speed:4,playerId:String(player?.id||''),timer:null,elapsed:0};
    drawFrame();
    playback.timer=setInterval(()=>{
      const q=playback;if(!q||!q.playing)return;
      q.elapsed+=.16*q.speed;
      while(q.index+1<q.sim.frames.length&&q.sim.frames[q.index+1].t<=q.elapsed)q.index++;
      if(q.elapsed>=q.sim.finishSeconds){q.index=q.sim.frames.length-1;q.playing=false;}
      drawFrame();
    },160);
  }
  function drawFrame(){
    const q=playback;if(!q)return;
    const f=q.sim.frames[q.index],dist=q.sim.distance;
    const rows=q.sim.ids.map((id,i)=>({id,name:q.sim.names[i],pos:f.p[i],speed:f.v[i]}))
      .sort((a,b)=>b.pos-a.pos || a.id.localeCompare(b.id));
    const track=$('hrs-track');if(!track){cleanup();return;}
    track.innerHTML=rows.map((x,i)=>`<div class="hrs-row ${x.id===q.playerId?'me':''}"><b>${i+1}</b><span>${escapeHtml(x.name)} ${x.id===q.playerId?'★':''}</span><div class="hrs-line"><div class="hrs-progress" style="width:${Math.min(100,x.pos/dist*100).toFixed(2)}%"></div></div><span>${Math.round(x.pos)}m</span></div>`).join('');
    $('hrs-clock').textContent=`${f.t.toFixed(1)}초 / ${q.sim.finishSeconds.toFixed(1)}초`;
    const frac=Math.max(...f.p)/dist;
    $('hrs-phase').textContent=frac<.1?'출발':frac<.3?'초반':frac<.65?'중반':frac<.8?'코너 통과':frac<1?'마지막 직선':'결승';
    $('hrs-seek').value=String(q.index);
    $('hrs-playbtn').textContent=q.playing?'일시정지':'재생';
    const finish=q.index===q.sim.frames.length-1;
    $('hrs-summary').innerHTML=finish
      ? `<b>공식 결과 · 실제 결승 통과 순서</b>${q.sim.results.map(x=>`<div class="leaderboardRow"><span>${x.place}착 · ${escapeHtml(x.horseName)}</span><b>${x.time.toFixed(2)}초 ${String(x.horseId)===q.playerId?'★':''}</b></div>`).join('')}`
      : `<div class="leaderboardRow"><span>현재 선두</span><b>${escapeHtml(rows[0]?.name||'-')}</b></div><div class="small">순위는 매 시점의 실제 주행 거리로 갱신됩니다.</div>`;
    if(finish)q.elapsed=Math.max(q.elapsed,q.sim.finishSeconds);
  }
  window.hrRaceReplayPause=function(){if(!playback)return;playback.playing=!playback.playing;if(playback.playing&&playback.index===playback.sim.frames.length-1){playback.index=0;playback.elapsed=0;}drawFrame();};
  window.hrRaceReplaySetSpeed=function(value){if(playback)playback.speed=[1,4,12].includes(value)?value:4;};
  window.hrRaceReplayJump=function(index){if(!playback)return;playback.index=Math.max(0,Math.min(playback.sim.frames.length-1,Math.floor(index)));playback.elapsed=playback.sim.frames[playback.index].t;playback.playing=false;drawFrame();};
  window.hrRaceReplayOpen=function(rid){const r=state.races.find(x=>x.id===rid);if(!r?.simulation)return;const saved=state.results.find(x=>x.raceId===rid);const h=saved?horse(saved.horseId):null;const j=saved?JOCKEYS.find(x=>x.name===saved.jockey):null;showPhysicalRace(r,h,saved?.place||0,saved?.payout||0,j);};
  showRace=function(r,scored,h,place,payout,j){
    if(!r?.simulation || r.simulation.version!==engine.version)return oldShowRace(r,scored,h,place,payout,j);
    return showPhysicalRace(r,h,place,payout,j);
  };
  openRaceResult=function(rid){
    oldResult(rid);
    const r=state.races.find(x=>x.id===rid);
    const modal=$('modalRoot').querySelector('.modalBox');
    if(r?.simulation && modal){
      const btn=document.createElement('button');
      btn.className='action gold';btn.style.marginTop='10px';btn.textContent='실제 경주 과정 다시 보기';
      btn.onclick=()=>window.hrRaceReplayOpen(rid);modal.appendChild(btn);
    }
  };
})();

</script>
